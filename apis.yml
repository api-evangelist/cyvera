name: Cyvera
description: >-
  Cyvera was an Israeli cybersecurity startup, founded in 2011 and backed by Battery Ventures,
  that pioneered exploit-prevention endpoint security. Its flagship product, TRAPS (Targeted
  Remote Attack Prevention System), blocked unknown, zero-day attacks by obstructing the exploitation
  techniques attackers rely on rather than relying on signatures. Cyvera was acquired by Palo Alto
  Networks in April 2014 for roughly $200M, and TRAPS was folded into Palo Alto's endpoint offering
  that ultimately became Cortex XDR. The independent company no longer operates; the cyvera.com domain
  no longer resolves and there is no live developer portal, public API, or artifact surface to enrich.
